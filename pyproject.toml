[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-health"
version = "1.0.0"
description = "Linux system health monitoring and maintenance utility"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13",
    "psutil>=5",
    "typer>=0.9",
]

[project.scripts]
linux-health = "linux_health.cli:app"
