[metadata]
name = linux-health
version = 1.0.0
description = Linux system health monitoring and maintenance utility

[options]
packages = linux_health
python_requires = >=3.10
install_requires =
    rich>=13
    psutil>=5
    typer>=0.9

[options.entry_points]
console_scripts =
    linux-health = linux_health.cli:app
